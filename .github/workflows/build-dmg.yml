name: Build SpaceSwitch DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build & Package DMG
    runs-on: macos-14  # Apple Silicon M1/M2 Mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Swift App (Universal Binary)
        working-directory: SwiftNative
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package .app Bundle
        working-directory: SwiftNative
        run: |
          APP_BUNDLE="build/SpaceSwitch.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          # Binary copy
          cp .build/apple/Products/Release/SpaceSwitch "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"
          chmod +x "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"

          # Info.plist
          cat > "$APP_BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SpaceSwitch</string>
              <key>CFBundleIdentifier</key>
              <string>com.spaceswitch.app</string>
              <key>CFBundleName</key>
              <string>SpaceSwitch</string>
              <key>CFBundleDisplayName</key>
              <string>SpaceSwitch</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "SpaceSwitch" \
            -srcfolder "SwiftNative/build/SpaceSwitch.app" \
            -ov \
            -format UDZO \
            "dist/SpaceSwitch-1.0.0.dmg"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSwitch-DMG
          path: dist/SpaceSwitch-1.0.0.dmg
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceSwitch-1.0.0.dmg
          name: SpaceSwitch ${{ github.ref_name }}
          body: |
            ## SpaceSwitch macOS App

            ### Installation
            1. Download `SpaceSwitch-1.0.0.dmg`
            2. Double click to open
            3. Drag SpaceSwitch to Applications
            4. Open from Applications folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
