name: Build SpaceSwitch DMG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package DMG
    runs-on: macos-14  # Apple Silicon M1/M2/M3 Mac Runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Swift App (Universal Binary: ARM64 + x86_64)
        working-directory: SwiftNative
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Package .app Bundle
        working-directory: SwiftNative
        run: |
          APP_BUNDLE="build/SpaceSwitch.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          # Find the compiled binary
          if [ -f ".build/apple/Products/Release/SpaceSwitch" ]; then
              cp .build/apple/Products/Release/SpaceSwitch "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"
          elif [ -f ".build/release/SpaceSwitch" ]; then
              cp .build/release/SpaceSwitch "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"
          else
              BINARY=$(find .build -type f -perm +111 -name "SpaceSwitch" | head -n 1)
              cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"
          fi
          
          chmod +x "$APP_BUNDLE/Contents/MacOS/SpaceSwitch"

          # Create Info.plist
          cat > "$APP_BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SpaceSwitch</string>
              <key>CFBundleIdentifier</key>
              <string>com.spaceswitch.app</string>
              <key>CFBundleName</key>
              <string>SpaceSwitch</string>
              <key>CFBundleDisplayName</key>
              <string>SpaceSwitch</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Create DMG with Applications Drag-and-Drop Shortcut
        run: |
          mkdir -p dist
          DMG_STAGING="dist/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          
          cp -R "SwiftNative/build/SpaceSwitch.app" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          
          hdiutil create \
            -volname "SpaceSwitch" \
            -srcfolder "$DMG_STAGING" \
            -ov \
            -format UDZO \
            "dist/SpaceSwitch-1.0.0.dmg"
          
          rm -rf "$DMG_STAGING"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceSwitch-DMG
          path: dist/SpaceSwitch-1.0.0.dmg
          retention-days: 30

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "SpaceSwitch macOS v1.0.0 (Native Release)"
          files: dist/SpaceSwitch-1.0.0.dmg
          draft: false
          prerelease: false
          body: |
            # SpaceSwitch macOS v1.0.0

            ### 🚀 Native macOS Workspace & Context Switcher
            - Built purely in Swift & SwiftUI
            - Universal Binary (Apple Silicon M1/M2/M3/M4 & Intel)
            - Instant workspace profiles switching (URLs, Browser, Env Vars, Spaces)
            - Menu Bar Extra background daemon

            ### 📦 Installation
            1. Download `SpaceSwitch-1.0.0.dmg` below.
            2. Double-click the `.dmg` file.
            3. Drag **SpaceSwitch** into your **Applications** folder.
            4. Open SpaceSwitch from Applications!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
